services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yt_trends
      POSTGRES_PASSWORD: yt_trends
      POSTGRES_DB: yt_trends
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/02-airflow.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yt_trends -d yt_trends"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.7.3
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      PYTHONPATH: /opt/airflow/yt_trends_repo/src
      DATABASE_URL: postgresql://yt_trends:yt_trends@postgres:5432/yt_trends
      _PIP_ADDITIONAL_PACKAGES: "google-api-python-client sqlalchemy psycopg2-binary python-dotenv spacy nltk vaderSentiment"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - .:/opt/airflow/yt_trends_repo
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    image: apache/airflow:2.7.3
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/yt_trends_repo/src
      DATABASE_URL: postgresql://yt_trends:yt_trends@postgres:5432/yt_trends
      _PIP_ADDITIONAL_PACKAGES: "google-api-python-client sqlalchemy psycopg2-binary python-dotenv spacy nltk vaderSentiment"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - .:/opt/airflow/yt_trends_repo
    command: scheduler

  airflow-init:
    image: apache/airflow:2.7.3
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
      "
    user: "50000:0"

volumes:
  postgres_data: {}
